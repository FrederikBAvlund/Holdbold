name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/holdbold
      DIRECT_URL: postgresql://user:password@localhost:5432/holdbold
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret
    services:
      postgres:
        # Spejl af det officielle image på AWS Public ECR: Docker Hub rate-limiter anonyme pulls fra GitHubs delte runnere.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: holdbold
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d holdbold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run cron:build
